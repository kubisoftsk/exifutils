name: Olympus X-3

tags:
  Make: OLYMPUS DIGITAL CAMERA
  # exiftool -n reports the raw Olympus camera type code instead of "X-3,C-60Z"
  Model: D4194

imageFields:
  - dateField: DateTimeOriginal
    localTime: true

videoFields:
  # CreationDate (with offset) is written by set-date, the camera itself writes only local TrackCreateDate
  - dateField: CreationDate
    localTime: true
  - dateField: TrackCreateDate
    localTime: true
