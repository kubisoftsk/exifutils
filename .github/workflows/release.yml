name: Release

# Default: release plan, tests, build, smoke test and a published release (which creates the tag).
# With "dry run": the same plan and checks, but nothing is created.
# See docs/releasing.md

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 1.2.3. Empty = suggested by the commits.'
        required: false
        type: string
      dry_run:
        description: 'Dry run: only show the plan and run the checks'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release

jobs:
  plan:
    name: Release plan
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: Check permission to release
        if: ${{ !inputs.dry_run && (github.ref != 'refs/heads/main' || github.triggering_actor != 'jakubgondar') }}
        run: |
          echo "::error::A release can be created only from main and only by the owner"
          exit 1

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Release plan
        id: plan
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 .github/scripts/release_plan.py ${VERSION:+--version "$VERSION"} \
            --notes notes.md --summary "$GITHUB_STEP_SUMMARY" --output "$GITHUB_OUTPUT"

      - name: Check that the version is not released yet
        env:
          TAG: v${{ steps.plan.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG"; then
            echo "::error::Tag $TAG already exists"
            exit 1
          fi

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: notes.md
          if-no-files-found: error
          retention-days: 7

  jar:
    name: Jar
    needs: plan
    uses: ./.github/workflows/build.yml
    with:
      revision: ${{ needs.plan.outputs.version }}

  publish:
    name: Publish release
    needs: [plan, jar]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect files
        run: |
          mkdir dist
          cp artifacts/exifutils-jar/exifutils.jar dist/exifutils.jar
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      # Releases are immutable in this repository: files have to be complete before the release is published,
      # so it is created as a draft with all files and published only if that succeeded
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.plan.outputs.version }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::Release $TAG already exists. If it is a draft left by a failed run, delete it first."
            exit 1
          fi
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$TAG" \
            --notes-file artifacts/release-notes/notes.md dist/*
          gh release edit "$TAG" --draft=false --latest
          echo "Released $TAG: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
