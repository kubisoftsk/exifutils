name: Release

# 1. Run without "draft": only the release plan (changes, suggested version, warnings) in the summary of the run.
# 2. Run with "draft": tests, builds and a draft release. Nothing is public and no tag exists yet.
# 3. Check the draft on GitHub and publish it, which creates the tag.
# See docs/releasing.md

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 1.2.3. Empty = suggested by the commits.'
        required: false
        type: string
      draft:
        description: 'Build and create a draft release (otherwise only the plan)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release

jobs:
  plan:
    name: Release plan
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: Check permission to release
        if: inputs.draft && (github.ref != 'refs/heads/main' || github.triggering_actor != 'jakubgondar')
        run: |
          echo "::error::A release can be created only from main and only by the owner"
          exit 1

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Release plan
        id: plan
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 .github/scripts/release_plan.py ${VERSION:+--version "$VERSION"} \
            --notes notes.md --summary "$GITHUB_STEP_SUMMARY" --output "$GITHUB_OUTPUT"

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: notes.md
          if-no-files-found: error
          retention-days: 7

  jar:
    name: Jar
    needs: plan
    if: inputs.draft
    uses: ./.github/workflows/build.yml
    with:
      revision: ${{ needs.plan.outputs.version }}

  native:
    name: Native
    needs: plan
    if: inputs.draft
    uses: ./.github/workflows/build-native.yml
    with:
      revision: ${{ needs.plan.outputs.version }}

  draft:
    name: Draft release
    needs: [plan, jar, native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect files
        run: |
          mkdir dist
          cp artifacts/exifutils-jar/exifutils.jar dist/exifutils.jar
          cp artifacts/exifutils-linux-native/exifutils dist/exifutils-linux-x64
          cp artifacts/exifutils-windows-native/exifutils.exe dist/exifutils-windows-x64.exe
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      # Releases are immutable in this repository: files have to be complete before the draft is published
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.plan.outputs.version }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::Release $TAG already exists. If it is a draft, delete it first."
            exit 1
          fi
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$TAG" \
            --notes-file artifacts/release-notes/notes.md dist/*
          echo "Draft $TAG is ready, check and publish it: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases" >> "$GITHUB_STEP_SUMMARY"
